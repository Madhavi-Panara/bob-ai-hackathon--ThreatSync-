submission:
  title: "ThreatSYNC — Threat Intelligence & Alert Prioritisation"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Defence analysts receive thousands of alerts every day from SIEM systems,
    cyber sensors, satellite feeds, and intelligence reports in different
    formats. Manually reviewing these alerts makes it difficult to identify
    genuine high-risk threats quickly while avoiding false positives.
    
  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ThreatSYNC is a web-based threat intelligence platform that ingests and
    normalizes multi-source alerts, correlates related alerts into incidents,
    assigns explainable risk scores, maps threats to MITRE ATT&CK techniques,
    and generates concise BLUF reports for faster decision-making.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
   - "Multi-source alert ingestion and normalization"
    - "Alert correlation into related security incidents"
    - "Explainable risk scoring and alert prioritisation"
    - "MITRE ATT&CK technique mapping"
    - "Commander-ready BLUF investigation summaries"

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Flask"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["Static JSON file"]                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
     Our strongest feature is the complete alert-to-decision pipeline. ThreatSYNC
    reduces a large volume of noisy alerts into correlated and prioritised
    incidents, maps the relevant MITRE ATT&CK techniques, and presents the
    result through concise BLUF reports in a commander-focused dashboard.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    --Integration with live enterprise security feeds and a production LLM such as watsonx.ai
    is planned for future developement.
